<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenLoom - Dev Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Status Bar -->
    <header class="status-bar">
      <div class="status-left">
        <span class="status-indicator" id="connectionStatus"></span>
        <span id="connectionText">Connecting...</span>
      </div>
      <div class="status-right">
        <button id="newScanBtn" class="btn btn-small">New Scan</button>
      </div>
    </header>

    <!-- Progress Bar (hidden by default) -->
    <div class="progress-container" id="progressContainer" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Scanning...</div>
    </div>

    <!-- Messages Area -->
    <main class="messages" id="messages">
      <div class="message assistant">
        <div class="message-content">
          <p>👋 Hello! I'm OpenLoom.</p>
          <p>Your digital life narrative assistant. What would you like to do?</p>
        </div>
        <div class="message-time">Just now</div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="input-area">
      <div class="input-container">
        <textarea 
          id="messageInput" 
          placeholder="Type your message..." 
          rows="1"
          autocomplete="off"
        ></textarea>
        <button id="sendBtn" class="btn btn-primary">Send</button>
      </div>
    </footer>
  </div>

  <!-- New Scan Modal -->
  <div class="modal" id="scanModal" style="display: none;">
    <div class="modal-content">
      <h2>Start New Scan</h2>
      <div class="form-group">
        <label for="scanPath">Directory Path</label>
        <input type="text" id="scanPath" placeholder="e.g., ~/Documents" />
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="personalMode" checked />
          Personal Mode (exclude common directories)
        </label>
      </div>
      <div class="modal-actions">
        <button id="cancelScanBtn" class="btn">Cancel</button>
        <button id="startScanBtn" class="btn btn-primary">Start Scan</button>
      </div>
    </div>
  </div>

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
