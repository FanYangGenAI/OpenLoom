[package]
name = "openloom-scanner"
version = "0.1.0"
edition = "2024"
description = "High-performance parallel file system scanner for OpenLoom"

[dependencies]
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
